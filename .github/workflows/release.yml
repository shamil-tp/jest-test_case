name: Draft Release and Upload Assets

on:
  push:
    tags:
      - 'v*' # Triggers on any tag starting with "v" (e.g., v1.0.0, v2.1.3-beta)

permissions:
  contents: write # Required permission to create releases and upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetches all history for tag comparisons & changelog generation

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --- Step 1: Create Build Artifacts / Assets ---
      - name: Build Application / Bundle Assets
        run: |
          mkdir -p dist
          tar -czvf dist/build-assets.tar.gz package.json package-lock.json

      # --- Step 2: Create GitHub Release with Auto-Generated Changelog ---
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/build-assets.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}